<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo Yo Yomi-</title>
    <style>
        :root {
            --bg-principal: #0b0c10;
            --bg-card: #1f2833;
            --accent-neon: #00f2fe;
            --accent-purple: #9b51e0;
            --text-muted: #aaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: #ffffff;
            line-height: 1.6;
        }

        /* Barra di Navigazione */
        header {
            background: linear-gradient(90deg, #121212, var(--bg-card));
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-purple);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-neon);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent-neon);
        }

        /* Griglia Giochi */
        .games-container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 30px;
            border-left: 5px solid var(--accent-neon);
            padding-left: 15px;
            text-transform: uppercase;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .game-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(155,81,224,0.3);
            border-color: var(--accent-purple);
        }

        .game-thumb {
            width: 100%;
            height: 160px;
            background: linear-gradient(45deg, #111, #333);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .game-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-title {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .game-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .play-btn {
            display: block;
            background: #222;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid var(--accent-neon);
            transition: background 0.3s;
        }

        .play-btn:hover {
            background: var(--accent-neon);
            color: var(--bg-principal);
        }

        footer {
            text-align: center;
            padding: 40px;
            margin-top: 80px;
            color: #555;
            font-size: 14px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ZGiochi</div>
    </header>

    <main class="games-container">
        <h2 class="section-title">Giochi</h2>
        <div class="games-grid">
            
            <!-- Card 1: 2048 -->
            <div class="game-card">
                <div class="game-thumb">PlaceHolder</div>
                <div class="game-info">
                    <div>
                        <h3 class="game-title">2048</h3>
                        <p class="game-desc">Gioco di Gabriele cirulli</p>
                    </div>
                    <a href="https://zamcrea.github.io/2048/" class="play-btn">Test</a>
                </div>
            </div>

          <div class="game-card">
                <div class="game-thumb">Placeholder</div>
                <div class="game-info">
                    <div>
                        <h3 class="game-title">2048 </h3>
                        <p class="game-desc">Gioco di Gabriele cirulli</p>
                    </div>
                    <a href="https://zamcrea.github.io/2048/" class="play-btn">Test</a>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; Ye non è per niente vuoto.</p>
    </footer>

</body>
</html>
