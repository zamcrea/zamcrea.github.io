<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVChat</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        .chat-header { background: #007bff; color: white; padding: 15px; font-size: 1.2em; font-weight: bold; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #e5ddd5; }
        .messaggio { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 0.95em; line-height: 1.4; word-wrap: break-word; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.15); }
        .inviato { background: #d9fdd3; align-self: flex-end; color: #303030; }
        .ricevuto { background: #ffffff; align-self: flex-start; color: #303030; }
        .autore { font-size: 0.75em; font-weight: bold; color: #128c7e; margin-bottom: 3px; display: block; }
        .orario { font-size: 0.65em; color: #666; float: right; margin-top: 5px; margin-left: 10px; }
        .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; box-shadow: 0 -2px 5px rgba(0,0,0,0.05); }
        .input-area input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; box-sizing: border-box; font-size: 1em; outline: none; }
        .input-area button { background: #06911b; color: white; border: none; padding: 0 20px; border-radius: 20px; font-size: 1em; font-weight: bold; cursor: pointer; }
        .blocco-sicurezza { text-align: center; padding: 50px 20px; font-family: Arial, sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .blocco-sicurezza h2 { color: #dc3545; }
        .blocco-sicurezza a { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
<script>
    if (localStorage.getItem("utenteLoggato") !== "true") {
        window.location.replace("login.html");
    }
</script>
<div class="chat-header">
    ChatVVeloce
    <div style="position: absolute; top: 10px; right: 15px; background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 15px; font-size: 0.75em; color: white;">
        Utente: <span id="nome-badge">...</span>
    </div>
</div>

<div class="chat-box" id="contenitore-chat"></div>

<div class="input-area">
    <input type="text" id="campo-messaggio" placeholder="Cliccami per scrivere" onkeypress="controllaInvio(event)">
    <button onclick="inviaMessaggio()">Invia</button>
</div>
<script>
    const PROJECT_ID = "6a608a69001dcb3466fc";
    const ENDPOINT = "https://appwrite.io";
    const DATABASE_ID = "6a6359510025ce3b3c9a"; 
    const COLLECTION_ID = "messages"; 

    let nicknameCorrente = "Studente";
    let ID_INTERVALLO_CHAT = null; // Salva il timer per poterlo gestire

    function recuperaProfiloServer() {
        const jwtToken = localStorage.getItem("appwriteJWT");

        let nomeDispositivo = "Dispositivo PC";
        const stringaBrowser = navigator.userAgent.toLowerCase();
        
        if (stringaBrowser.includes("ipad")) { nomeDispositivo = "iPad"; } 
        else if (stringaBrowser.includes("iphone")) { nomeDispositivo = "iPhone"; } 
        else if (stringaBrowser.includes("android")) { nomeDispositivo = "Android"; } 
        else if (stringaBrowser.includes("macintosh")) { nomeDispositivo = "Mac"; }

        let intestazioni = {
            "X-Appwrite-Project": PROJECT_ID,
            "X-SDK-Name": "Web",
            "X-SDK-Version": "14.0.0"
        };
        if (jwtToken) { intestazioni["X-Appwrite-JWT"] = jwtToken; }

        // Forza lo svuotamento preventivo della chat per sicurezza prima del controllo
        document.getElementById("contenitore-chat").innerHTML = "Verifica sicurezza in corso...";

        fetch(`${ENDPOINT}/account`, {
            method: "GET",
            mode: "cors",
            headers: intestazioni
        })
        .then(res => res.json())
        .then(user => {
            // CONTROLLO RIGIDO DELLE 24 ORE
            if (user && user.$createdAt) {
                const dataCreazione = new Date(user.$createdAt).getTime();
                const dataAttuale = Date.now();
                const ventiquattroOre = 24 * 60 * 60 * 1000;

                if (dataAttuale - dataCreazione < ventiquattroOre) {
                    // BLOCCO RETE: Ferma l'esecuzione e cancella l'interfaccia di input
                    document.body.innerHTML = `
                        <div class="blocco-sicurezza">
                            <h2>Accesso Limitato ⏳</h2>
                            <p>Per evitare lo spam, puoi usare la chat solo dopo 24 ore dalla registrazione.</p>
                            <p>Torna quando il tuo account sarà abilitato!</p>
                            <a href="index.html">Torna alla Home</a>
                        </div>
                    `;
                    return; // Stoppa definitivamente lo script
                }
            }

            // SOLO SE SUPERA IL CONTROLLO IL CODICE PROSEGUE QUI SOTTO
            if (user && user.name && user.name.trim() !== "") {
                nicknameCorrente = user.name;
            } else {
                nicknameCorrente = nomeDispositivo;
            }
            document.getElementById("nome-badge").innerText = nicknameCorrente;
            
            // Avvia lo scaricamento dei messaggi e attiva il loop dei 3 secondi
            caricaMessaggi();
            ID_INTERVALLO_CHAT = setInterval(caricaMessaggi, 3000);
        })
        .catch(() => {
            // Se salta la connessione con il cloud blocca tutto per precauzione
            document.body.innerHTML = `
                <div class="blocco-sicurezza">
                    <h2>Errore di Autenticazione ⚠️</h2>
                    <p>Impossibile validare i criteri di sicurezza con il server Appwrite.</p>
                    <a href="index.html">Torna alla Home</a>
                </div>
            `;
        });
    }

    function caricaMessaggi() {
        fetch(`${ENDPOINT}/databases/${DATABASE_ID}/collections/${COLLECTION_ID}/documents?limit=100&orderType=ASC`, {
            method: "GET",
            mode: "cors",
            headers: {
                "X-Appwrite-Project": PROJECT_ID,
                "X-SDK-Name": "Web",
                "X-SDK-Version": "14.0.0"
            }
        })
        .then(res => res.json())
        .then(data => {
            const box = document.getElementById("contenitore-chat");
            box.innerHTML = ""; 

            if (data.documents) {
                data.documents.forEach(doc => {
                    const div = document.createElement("div");
                    const tipoClasse = (doc.autore === nicknameCorrente) ? "messaggio inviato" : "messaggio ricevuto";
                    div.className = tipoClasse;

                    const dataMessaggio = new Date(doc.ora);
                    const oraLeggibile = dataMessaggio.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });

                    div.innerHTML = `
                        <span class="autore">${doc.autore}</span>
                        ${doc.testo}
                        <span class="orario">${oraLeggibile}</span>
                    `;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            }
        })
        .catch(err => console.error("Errore lettura messaggi:", err));
    }

    function inviaMessaggio() {
        const campo = document.getElementById("campo-messaggio");
        const testoMessaggio = campo.value.trim();

        if (!testoMessaggio) return;

        fetch(`${ENDPOINT}/databases/${DATABASE_ID}/collections/${COLLECTION_ID}/documents`, {
            method: "POST",
            mode: "cors",
            headers: {
                "Content-Type": "application/json",
                "X-Appwrite-Project": PROJECT_ID,
                "X-SDK-Name": "Web",
                "X-SDK-Version": "14.0.0"
            },
            body: JSON.stringify({
                documentId: "unique()",
                data: {
                    testo: testoMessaggio,
                    autore: nicknameCorrente, 
                    ora: Date.now() 
                }
            })
        })
        .then(res => res.json())
        .then(data => {
            campo.value = ""; 
            caricaMessaggi(); 
        })
        .catch(err => alert("Errore di invio. Blame Kernel."));
    }

    function controllaInvio(e) {
        if (e.key === 'Enter') {
            inviaMessaggio();
        }
    }

    // L'avvio automatico chiama SOLO il controllo del profilo.
    // Il setInterval si attiverà unicamente dall'interno della promessa risolta.
    recuperaProfiloServer();
</script>
>
</body>
</html>
