<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVChat</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        .chat-header { background: #007bff; color: white; padding: 15px; font-size: 1.2em; font-weight: bold; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #e5ddd5; }
        .messaggio { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 0.95em; line-height: 1.4; word-wrap: break-word; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.15); }
        .inviato { background: #d9fdd3; align-self: flex-end; color: #303030; }
        .ricevuto { background: #ffffff; align-self: flex-start; color: #303030; }
        .autore { font-size: 0.75em; font-weight: bold; color: #128c7e; margin-bottom: 3px; display: block; }
        .orario { font-size: 0.65em; color: #666; float: right; margin-top: 5px; margin-left: 10px; }
        .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; box-shadow: 0 -2px 5px rgba(0,0,0,0.05); }
        .input-area input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; box-sizing: border-box; font-size: 1em; outline: none; }
        .input-area button { background: #06911b; color: white; border: none; padding: 0 20px; border-radius: 20px; font-size: 1em; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<script>
    if (localStorage.getItem("utenteLoggato") !== "true") {
        window.location.replace("login.html");
    }
</script>
<div class="chat-header">
    ChatVVeloce
    <div style="position: absolute; top: 10px; right: 15px; background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 15px; font-size: 0.75em; color: white;">
        Utente: <span id="nome-badge">...</span>
    </div>
</div>

<div class="chat-box" id="contenitore-chat"></div>

<div class="input-area">
    <input type="text" id="campo-messaggio" placeholder="Metti il tuo nickname/o un nome con cui ti identifichi scrivendo /whoami iltuonickname(quindi ad es.:/whoami KernelZam) per scrivere..." onkeypress="controllaInvio(event)">

    <button onclick="inviaMessaggio()">Invia</button>
</div>
<script>
    const PROJECT_ID = "6a608a69001dcb3466fc";
    const ENDPOINT = "https://fra.cloud.appwrite.io/v1";
    const DATABASE_ID = "6a6359510025ce3b3c9a"; 
    const COLLECTION_ID = "messages"; 
    const PROFILI_COLLECTION_ID = "profili";

    let nicknameCorrente = "Studente";
    let emailUtenteFittizia = "anonimo@scuolavveloce.it"; // Usata come chiave per recuperare il profilo

    // Rileva il dispositivo di riserva
    function ottieniNomeDispositivo() {
        const stringaBrowser = navigator.userAgent.toLowerCase();
        if (stringaBrowser.includes("ipad")) return "iPad";
        if (stringaBrowser.includes("iphone")) return "iPhone";
        if (stringaBrowser.includes("android")) return "Android";
        if (stringaBrowser.includes("macintosh")) return "Mac";
        return "Dispositivo PC";
    }

    // Carica il profilo memorizzato su Appwrite per questo specifico dispositivo
    function scaricaProfiloDaServer() {
        // Generiamo una stringa univoca per il dispositivo basata sull'UserAgent per simulare un identificativo
        emailUtenteFittizia = navigator.userAgent.replace(/[^a-zA-Z0-9]/g, "").substring(0, 30) + "@vve.it";

        fetch(`${ENDPOINT}/databases/${DATABASE_ID}/collections/${PROFILI_COLLECTION_ID}/documents?queries[]=equal("email", "${emailUtenteFittizia}")`, {
            method: "GET",
            mode: "cors",
            headers: { "X-Appwrite-Project": PROJECT_ID }
        })
        .then(res => res.json())
        .then(data => {
            if (data.documents && data.documents.length > 0) {
                // Se c'è un profilo salvato nel database, usa quel nickname
                nicknameCorrente = data.documents[0].nickname;
            } else {
                // Altrimenti imposta il nome dispositivo standard
                nicknameCorrente = ottieniNomeDispositivo();
            }
            document.getElementById("nome-badge").innerText = nicknameCorrente;
            caricaMessaggi();
        })
        .catch(() => {
            nicknameCorrente = ottieniNomeDispositivo();
            document.getElementById("nome-badge").innerText = nicknameCorrente;
            caricaMessaggi();
        });
    }

    // Gestisce il comando /whoami in modo invisibile salvandolo su Appwrite
    function eseguiComandoWhoami(testo) {
        const nuovoNome = testo.substring(8).trim();
        if (!nuovoNome) return;

        // Cambia la grafica locale all'istante
        nicknameCorrente = nuovoNome;
        document.getElementById("nome-badge").innerText = nuovoNome;

        // Controlla se esiste già un record per aggiornarlo o crearlo da zero
        fetch(`${ENDPOINT}/databases/${DATABASE_ID}/collections/${PROFILI_COLLECTION_ID}/documents?queries[]=equal("email", "${emailUtenteFittizia}")`, {
            method: "GET",
            mode: "cors",
            headers: { "X-Appwrite-Project": PROJECT_ID }
        })
        .then(res => res.json())
        .then(data => {
            if (data.documents && data.documents.length > 0) {
                // Aggiorna esistente (PUT)
                const docId = data.documents[0].$id;
                fetch(`${ENDPOINT}/databases/${DATABASE_ID}/collections/${PROFILI_COLLECTION_ID}/documents/${docId}`, {
                    method: "PATCH",
                    mode: "cors",
                    headers: { "Content-Type": "application/json", "X-Appwrite-Project": PROJECT_ID },
                    body: JSON.stringify({ data: { nickname: nuovoNome } })
                });
            } else {
                // Crea nuovo record (POST)
                fetch(`${ENDPOINT}/databases/${DATABASE_ID}/collections/${PROFILI_COLLECTION_ID}/documents`, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "application/json", "X-Appwrite-Project": PROJECT_ID },
                    body: JSON.stringify({
                        documentId: "unique()",
                        data: { email: emailUtenteFittizia, nickname: nuovoNome }
                    })
                });
            }
        })
        .catch(err => console.error("Errore salvataggio profilo cloud:", err));
    }

      async function caricaMessaggi() {
        const box = document.getElementById("contenitore-chat");
        let tuttiIDocumenti = [];
        let offset = 0;
        const limitePerRichiesta = 100;
        const limiteMassimoTotale = 1000;

        try {
            // Ciclo per scaricare i blocchi di messaggi finché non raggiungiamo il massimo o finiscono i dati
            while (offset < limiteMassimoTotale) {
                const url = `${ENDPOINT}/databases/${DATABASE_ID}/collections/${COLLECTION_ID}/documents?queries[]=limit(${limitePerRichiesta})&queries[]=offset(${offset})&orderType=ASC`;
                
                const res = await fetch(url, {
                    method: "GET",
                    mode: "cors",
                    headers: {
                        "X-Appwrite-Project": PROJECT_ID,
                        "X-SDK-Name": "Web",
                        "X-SDK-Version": "14.0.0"
                    }
                });
                
                const data = await res.json();
                
                if (data.documents && data.documents.length > 0) {
                    tuttiIDocumenti = tuttiIDocumenti.concat(data.documents);
                    
                    // Se il server ha restituito meno di 100 messaggi, significa che abbiamo scaricato tutto
                    if (data.documents.length < limitePerRichiesta) {
                        break;
                    }
                    offset += limitePerRichiesta;
                } else {
                    break;
                }
            }

            // Eseguiamo il rendering solo dopo aver accumulato tutti i blocchi
            box.innerHTML = ""; 

            tuttiIDocumenti.forEach(doc => {
                const div = document.createElement("div");
                const tipoClasse = (doc.autore === nicknameCorrente) ? "messaggio inviato" : "messaggio ricevuto";
                div.className = tipoClasse;

                const dataMessaggio = new Date(doc.ora);
                const oraLeggibile = dataMessaggio.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });

                div.innerHTML = `
                    <span class="autore">${doc.autore}</span>
                    ${doc.testo}
                    <span class="orario">${oraLeggibile}</span>
                `;
                box.appendChild(div);
            });

            // Cerchiamo di non buttarti indietro dopo aver visto una parte dei messaggi vecchi
            const vicinoAlFondo = (box.scrollHeight - box.scrollTop - box.clientHeight) < 150;
            if (box.dataset.caricato !== "true" || vicinoAlFondo) {
                box.scrollTop = box.scrollHeight;
                box.dataset.caricato = "true";
            }

        } catch (err) {
            console.error("Errore nel caricamento dei 20000000 messaggi mandati:", err);
        }
    }

    }

function inviaMessaggio() {
    const campo = document.getElementById("campo-messaggio");
    const testoMessaggio = campo.value.trim();

    if (!testoMessaggio) return;

    // --- CONTROLLO INVISIBILE AIUTANTE ---
    // Se l'utente sta scrivendo un comando per darsi il nome, lo facciamo passare sempre!
    if (testoMessaggio.startsWith('/whoami ')) {
        eseguiComandoWhoami(testoMessaggio);
        campo.value = "";
        return;
    }

    if (testoMessaggio === '/rules' || testoMessaggio === '/regole') {
        mostraRegoleChat();
        campo.value = "";
        return;
    }

    // --- BLOCCO SCRITTURA PER UTENTI SENZA NOME ---
    // Se l'utente ha ancora il nome di default del telefono, blocchiamo l'invio
    if (nicknameCorrente === "Android" || 
        nicknameCorrente === "iPhone" || 
        nicknameCorrente === "iPad" || 
        nicknameCorrente === "Mac" || 
        nicknameCorrente === "Dispositivo PC" || 
        nicknameCorrente === "Studente" ||
        nicknameCorrente === "...") {
        
        alert("⚠️ Per poter inviare messaggi devi prima impostare un nome protetto!\n\nUsa il comando: /whoami Nome Password");
        return; // Interrompe la funzione: il messaggio NON viene inviato a Appwrite
    }

    // Se ha un nome valido, il codice prosegue normalmente inviando il messaggio
    fetch(`${ENDPOINT}/databases/${DATABASE_ID}/collections/${COLLECTION_ID}/documents`, {
        method: "POST",
        mode: "cors",
        headers: {
            "Content-Type": "application/json",
            "X-Appwrite-Project": PROJECT_ID,
            "X-SDK-Name": "Web",
            "X-SDK-Version": "14.0.0"
        },
        body: JSON.stringify({
            documentId: "unique()",
            data: {
                testo: testoMessaggio,
                autore: nicknameCorrente, 
                ora: Date.now() 
            }
        })
    })
    .then(res => res.json())
    .then(() => {
        campo.value = ""; 
        caricaMessaggi(); 
    })
    .catch(() => alert("Errore di invio. Blame Zam."));
}

    function controllaInvio(e) {
        if (e.key === 'Enter') {
            inviaMessaggio();
        }
    }

    scaricaProfiloDaServer();
    setInterval(caricaMessaggi, 3000);
    function mostraRegoleChat() {
    const elencoRegole = 
        "REGOLE DI VVCHAT!\n\n" +
        "1. Non insultare qualcuno/Non dire parolacce/bestemmie(parole volgari).  Può comportare da warning a perma-ban dalla chat(in base alla gravità).\n" +
        "2. Niente Spam: non inondare la chat di messaggi ripetitivi.  Da warning a ban\n" +
        "3. Contenuti appropriati: usa la chat solo per questioni scolastiche/discussioni riferite alla scuola. Warning\n" +
        "4. Usa la tua identità: non usare nomi offensivi/falsi con /whoami,metti solo nomi che ti identificano,metti il tuo nickname.warning to ban\n\n" +
        "5. Non usare il tuo vero nome o quello degli altri,perma ban" +
        "Usa /(commando) per eseguire commandi(/whoami,/rules)";
        
    alert(elencoRegole);
}

</script>
</body>
</html>
